name: CI - CV Projects Vault & Tooling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Mermaid validator dependencies
        run: bun add -d mermaid jsdom @mermaid-js/parser
      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Lint check
        run: uv run ruff check .

      - name: Vault integrity validation
        run: uv run python scripts/cli.py validate

      - name: Vault doc sync check
        run: uv run python scripts/cli.py sync

      - name: Run pytest test suite
        run: uv run pytest -v tests/
